version: "3.8"

services:
  mongo:
    image: mongo:8
    pull_policy: missing
    container_name: sra-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?请设置 MONGO_PASSWORD 环境变量}
    volumes:
      - ~/docker-volumes/mongodb:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
        reservations:
          memory: 256m
          cpus: '0.25'
    networks:
      - internal

  redis:
    image: redis:7-alpine
    pull_policy: missing
    container_name: sra-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 64m
          cpus: '0.1'
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sra-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '2.0'
        reservations:
          memory: 128m
          cpus: '0.5'
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/data/chroma
    networks:
      - internal
      - external

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sra-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
        reservations:
          memory: 32m
          cpus: '0.1'
    networks:
      - external

volumes:
  mongo_data:
  redis_data:
  uploads_data:
  chroma_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
