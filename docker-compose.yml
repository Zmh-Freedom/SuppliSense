version: "3.8"

services:
  mongo:
    image: mongo:8
    pull_policy: missing
    container_name: sra-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - ~/docker-volumes/mongodb:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
        reservations:
          memory: 256m
          cpus: '0.25'

  redis:
    image: redis:7-alpine
    pull_policy: missing
    container_name: sra-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 64m
          cpus: '0.1'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sra-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '2.0'
        reservations:
          memory: 128m
          cpus: '0.5'
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/data/chroma

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sra-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
        reservations:
          memory: 32m
          cpus: '0.1'

volumes:
  mongo_data:
  redis_data:
  uploads_data:
  chroma_data:
