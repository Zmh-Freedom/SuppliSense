[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "agent_e2e: deterministic end-to-end Agent workflow regression",
    "agent_chat_contract: P0 authenticated chat context contract regression",
    "integration: tests that require live PostgreSQL, MongoDB, or Redis services",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/services/feishu.py",
]

[tool.coverage.report]
fail_under = 20
show_missing = true
