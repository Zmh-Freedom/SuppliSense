services:
  mongo:
    image: mongo:8
    pull_policy: missing
    container_name: sra-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?请设置 MONGO_PASSWORD}
    volumes:
      - ~/docker-volumes/mongodb:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
        reservations:
          memory: 256m
          cpus: '0.25'

  postgres:
    image: pgvector/pgvector:pg16
    pull_policy: missing
    container_name: sra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-sra}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请设置 PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-sra}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sra -d sra"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
        reservations:
          memory: 128m
          cpus: '0.25'

  redis:
    image: redis:7-alpine
    pull_policy: missing
    container_name: sra-redis
    restart: unless-stopped
    command: >
      sh -c 'exec redis-server $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}'
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.5'
        reservations:
          memory: 32m
          cpus: '0.1'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sra-backend
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt -q &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - backend/.env
    environment:
      - MONGO_HOST=mongo
      - REDIS_URL=redis://redis:6379
      - PG_HOST=postgres
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
        reservations:
          memory: 256m
          cpus: '0.5'

volumes:
  mongo_data:
  redis_data:
  uploads_data:
  pg_data:
