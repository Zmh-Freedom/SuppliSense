<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <title>供应商智能寻源与风险监控工作台 Agent 编排流程</title>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#183b67"/>
      <stop offset="1" stop-color="#187c88"/>
    </linearGradient>
    <linearGradient id="harness" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f8ff"/>
      <stop offset="1" stop-color="#eefaf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16324f" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c7895"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d47c28"/>
    </marker>
    <style>
      .title { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif; font-size: 38px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif; font-size: 18px; fill: #d9eef0; }
      .section { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif; font-size: 21px; font-weight: 700; fill: #183b67; }
      .box-title { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif; font-size: 20px; font-weight: 700; fill: #183b67; }
      .box-text { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif; font-size: 16px; fill: #48657d; }
      .small { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif; font-size: 14px; fill: #698398; }
      .chip-title { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif; font-size: 17px; font-weight: 700; fill: #1d6f74; }
      .chip-text { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif; font-size: 14px; fill: #52757c; }
      .flow { fill: none; stroke: #4c7895; stroke-width: 3; marker-end: url(#arrow); }
      .flow-dashed { fill: none; stroke: #6b9a9f; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .flow-orange { fill: none; stroke: #d47c28; stroke-width: 3; marker-end: url(#arrowOrange); }
      .label { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif; font-size: 14px; font-weight: 700; fill: #5d7890; }
      .label-orange { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif; font-size: 14px; font-weight: 700; fill: #b46620; }
    </style>
  </defs>

  <rect width="1800" height="1260" fill="#ffffff"/>
  <rect width="1800" height="122" fill="url(#header)"/>
  <text x="70" y="58" class="title">供应商智能寻源与风险监控工作台</text>
  <text x="70" y="94" class="subtitle">Agent 编排流程图｜LangGraph Harness 负责任务状态，LangChain 负责模型与工具能力连接</text>

  <text x="70" y="162" class="section">一、请求进入</text>
  <g filter="url(#shadow)">
    <rect x="70" y="188" width="260" height="112" rx="18" fill="#edf5ff" stroke="#a9c9e9" stroke-width="2"/>
    <text x="200" y="226" text-anchor="middle" class="box-title">采购人员</text>
    <text x="200" y="256" text-anchor="middle" class="box-text">自然语言问题 / 复核动作</text>
    <text x="200" y="282" text-anchor="middle" class="small">例如：查看我负责的供应商风险变化</text>

    <rect x="70" y="350" width="260" height="112" rx="18" fill="#f3f0ff" stroke="#bdb2e9" stroke-width="2"/>
    <text x="200" y="388" text-anchor="middle" class="box-title">FastAPI Chat API</text>
    <text x="200" y="418" text-anchor="middle" class="box-text">身份认证｜责任范围｜会话快照</text>
    <text x="200" y="444" text-anchor="middle" class="small">SSE 流式事件与统一入口</text>
  </g>
  <path d="M200 300 V350" class="flow"/>
  <path d="M330 406 H440" class="flow"/>

  <text x="440" y="162" class="section">二、LangGraph Harness：一次请求的统一执行编排</text>
  <rect x="440" y="188" width="1290" height="752" rx="24" fill="url(#harness)" stroke="#5d9dad" stroke-width="3" filter="url(#shadow)"/>
  <rect x="468" y="210" width="1234" height="48" rx="14" fill="#d8edf1"/>
  <text x="1085" y="241" text-anchor="middle" class="box-title">唯一活动只读执行内核｜Session / Turn / Run / Task 全程可追踪</text>

  <g filter="url(#shadow)">
    <rect x="480" y="292" width="220" height="110" rx="16" fill="#ffffff" stroke="#a9c9e9" stroke-width="2"/>
    <text x="590" y="329" text-anchor="middle" class="box-title">1. 上下文快照</text>
    <text x="590" y="358" text-anchor="middle" class="box-text">load_session</text>
    <text x="590" y="384" text-anchor="middle" class="small">初始化预算与运行状态</text>

    <rect x="750" y="292" width="220" height="110" rx="16" fill="#ffffff" stroke="#a9c9e9" stroke-width="2"/>
    <text x="860" y="329" text-anchor="middle" class="box-title">2. 意图与权限</text>
    <text x="860" y="358" text-anchor="middle" class="box-text">resolve_turn</text>
    <text x="860" y="384" text-anchor="middle" class="small">消费同一 execution_context</text>

    <rect x="1020" y="292" width="220" height="110" rx="16" fill="#ffffff" stroke="#a9c9e9" stroke-width="2"/>
    <text x="1130" y="329" text-anchor="middle" class="box-title">3. 任务规划</text>
    <text x="1130" y="358" text-anchor="middle" class="box-text">build_plan</text>
    <text x="1130" y="384" text-anchor="middle" class="small">形成任务矩阵与依赖</text>

    <rect x="1290" y="292" width="220" height="110" rx="16" fill="#ffffff" stroke="#7db8b0" stroke-width="2"/>
    <text x="1400" y="329" text-anchor="middle" class="box-title">4. 任务执行</text>
    <text x="1400" y="358" text-anchor="middle" class="box-text">execute_ready_tasks</text>
    <text x="1400" y="384" text-anchor="middle" class="small">按依赖与预算执行</text>
  </g>
  <path d="M700 347 H750" class="flow"/>
  <path d="M970 347 H1020" class="flow"/>
  <path d="M1240 347 H1290" class="flow"/>

  <rect x="520" y="454" width="1120" height="122" rx="18" fill="#ffffff" stroke="#83bdb8" stroke-width="2"/>
  <text x="1080" y="486" text-anchor="middle" class="chip-title">LangChain ToolRegistry / ToolExecutor</text>
  <text x="1080" y="512" text-anchor="middle" class="chip-text">统一输入输出契约｜权限、超时、重试、证据要求和幂等策略</text>
  <g>
    <rect x="555" y="530" width="300" height="30" rx="10" fill="#eff9f7"/>
    <text x="705" y="551" text-anchor="middle" class="chip-text">风险 / 财务 / 司法 / 舆情工具</text>
    <rect x="910" y="530" width="300" height="30" rx="10" fill="#eff9f7"/>
    <text x="1060" y="551" text-anchor="middle" class="chip-text">交易 / 历史关系 / 寻源工具</text>
    <rect x="1265" y="530" width="340" height="30" rx="10" fill="#eff9f7"/>
    <text x="1435" y="551" text-anchor="middle" class="chip-text">主体确认 / 责任范围校验工具</text>
  </g>
  <path d="M1400 402 V454" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="520" y="630" width="250" height="112" rx="16" fill="#ffffff" stroke="#a9c9e9" stroke-width="2"/>
    <text x="645" y="667" text-anchor="middle" class="box-title">5. 证据校验</text>
    <text x="645" y="696" text-anchor="middle" class="box-text">validate_evidence</text>
    <text x="645" y="722" text-anchor="middle" class="small">Claim / Evidence / 覆盖状态</text>

    <rect x="850" y="630" width="250" height="112" rx="16" fill="#ffffff" stroke="#d2b27d" stroke-width="2"/>
    <text x="975" y="667" text-anchor="middle" class="box-title">证据是否完整？</text>
    <text x="975" y="696" text-anchor="middle" class="box-text">检查必需维度与引用</text>
    <text x="975" y="722" text-anchor="middle" class="small">预算耗尽则明确返回边界</text>

    <rect x="1180" y="630" width="250" height="112" rx="16" fill="#ffffff" stroke="#7db8b0" stroke-width="2"/>
    <text x="1305" y="667" text-anchor="middle" class="box-title">6. 生成 AgentAnswer</text>
    <text x="1305" y="696" text-anchor="middle" class="box-text">render_answer</text>
    <text x="1305" y="722" text-anchor="middle" class="small">结论 / 依据 / 下一步动作</text>

    <rect x="1510" y="630" width="170" height="112" rx="16" fill="#ffffff" stroke="#bcb8da" stroke-width="2"/>
    <text x="1595" y="667" text-anchor="middle" class="box-title">7. 持久化</text>
    <text x="1595" y="696" text-anchor="middle" class="box-text">persist_turn</text>
    <text x="1595" y="722" text-anchor="middle" class="small">可恢复运行记录</text>
  </g>
  <path d="M1080 576 C1080 600 645 600 645 630" class="flow"/>
  <path d="M770 686 H850" class="flow"/>
  <path d="M1100 686 H1180" class="flow"/>
  <path d="M1430 686 H1510" class="flow"/>
  <text x="1135" y="674" class="label">完整</text>

  <rect x="850" y="795" width="250" height="92" rx="16" fill="#fff8ed" stroke="#d2a66e" stroke-width="2"/>
  <text x="975" y="830" text-anchor="middle" class="box-title">补偿检索 / 有限重试</text>
  <text x="975" y="858" text-anchor="middle" class="box-text">remediate</text>
  <text x="975" y="879" text-anchor="middle" class="small">不无限循环</text>
  <path d="M975 742 V795" class="flow-orange"/>
  <text x="1000" y="774" class="label-orange">不完整</text>
  <path d="M850 841 C700 841 590 790 590 742" class="flow-dashed"/>
  <text x="658" y="818" class="label">回到工具执行</text>

  <path d="M1595 742 V910 H1730" class="flow"/>
  <text x="1608" y="805" class="label">返回工作台</text>

  <text x="70" y="980" class="section">三、需要改变业务状态时：独立的人工审批恢复链路</text>
  <rect x="70" y="1005" width="1660" height="166" rx="22" fill="#fffaf2" stroke="#e1b778" stroke-width="3"/>
  <g filter="url(#shadow)">
    <rect x="110" y="1040" width="300" height="90" rx="16" fill="#ffffff" stroke="#e1b778" stroke-width="2"/>
    <text x="260" y="1075" text-anchor="middle" class="box-title">ActionProposal</text>
    <text x="260" y="1103" text-anchor="middle" class="box-text">加入 / 移出风险监控等写操作</text>

    <rect x="490" y="1040" width="300" height="90" rx="16" fill="#ffffff" stroke="#e1b778" stroke-width="2"/>
    <text x="640" y="1075" text-anchor="middle" class="box-title">interrupt()</text>
    <text x="640" y="1103" text-anchor="middle" class="box-text">暂停图执行并发出审批事件</text>

    <rect x="870" y="1040" width="300" height="90" rx="16" fill="#ffffff" stroke="#e1b778" stroke-width="2"/>
    <text x="1020" y="1075" text-anchor="middle" class="box-title">人工批准 / 拒绝</text>
    <text x="1020" y="1103" text-anchor="middle" class="box-text">保留操作人、意见和审计记录</text>

    <rect x="1250" y="1040" width="400" height="90" rx="16" fill="#ffffff" stroke="#e1b778" stroke-width="2"/>
    <text x="1450" y="1075" text-anchor="middle" class="box-title">Command(resume) → ToolExecutor</text>
    <text x="1450" y="1103" text-anchor="middle" class="box-text">批准后恢复执行，返回回执并同步通知</text>
  </g>
  <path d="M410 1085 H490" class="flow-orange"/>
  <path d="M790 1085 H870" class="flow-orange"/>
  <path d="M1170 1085 H1250" class="flow-orange"/>
  <path d="M1730 910 C1760 910 1760 1085 1650 1085" class="flow-orange"/>
  <text x="1420" y="970" class="label-orange">写操作请求进入人工控制链路</text>

  <rect x="70" y="1195" width="1660" height="42" rx="12" fill="#eef5f7" stroke="#c6dce2"/>
  <text x="900" y="1222" text-anchor="middle" class="chip-text">核心原则：只读请求统一走 Harness；工具结果先形成证据，再生成结论；写操作必须 Proposal + 人工审批 + 可恢复回执</text>
</svg>
