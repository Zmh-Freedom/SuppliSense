name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: ./scripts/check-commit-message.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sra
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: sra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sra -d sra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: ci_password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-for-testing-only-32chars
      INITIAL_ADMIN_PASSWORD: ci-admin-bootstrap-only
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: 27017
      MONGO_USER: root
      MONGO_PASSWORD: ci_password
      MONGO_DB: tianyancha_test
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: sra
      PG_PASSWORD: ci_password
      PG_DB: sra
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_PASSWORD: ""
      AGENT_RUN_V2_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize PostgreSQL schema for unit tests
        run: python -c "from app.db.init_pg import ensure_pg_schema; ensure_pg_schema()"

      - name: Run unit and graph tests with coverage
        run: >-
          python -m pytest -v
          -m "not integration and not agent_e2e"
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=20

      - name: Enforce targeted Harness core coverage
        run: >-
          python -m pytest -q
          -m "not integration"
          --cov=app.graphs.harness.graph
          --cov=app.graphs.harness.state
          --cov=app.graphs.agent_core.answer_contract
          --cov=app.graphs.agent_core.evidence_ledger
          --cov=app.tools.executor
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Run PostgreSQL, MongoDB, and Redis integration tests
        run: python -m pytest -v -m "integration and not agent_e2e_live"

      - name: Run isolated Run lifecycle and projection races
        run: |
          python - <<'PY'
          import os
          import psycopg2
          connection = psycopg2.connect(
              host=os.environ['PG_HOST'], port=os.environ['PG_PORT'],
              user=os.environ['PG_USER'], password=os.environ['PG_PASSWORD'],
              dbname=os.environ['PG_DB'],
          )
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute('CREATE DATABASE run_lifecycle_test')
              cursor.execute('CREATE DATABASE assessment_stage2_test')
              cursor.execute('CREATE DATABASE outbox_service_test')
          connection.close()
          PY
          PG_DB=run_lifecycle_test MONGO_DB=run_lifecycle_test python -m pytest -q tests/test_run_coordinator.py tests/test_run_coordinator_integration.py tests/test_harness_execution_control.py tests/test_harness_managed_runner.py tests/test_checkpoint_recovery.py tests/test_supervisor_lifecycle_integration.py tests/test_agent_worker_integration.py tests/test_agent_worker_shutdown.py tests/test_agent_worker_streaming.py tests/test_outbox_database_safety.py

      - name: Run Outbox integration on its dedicated database
        run: PG_DB=outbox_service_test MONGO_DB=outbox_service_test python -m pytest -q tests/test_outbox_service.py

      - name: Run isolated frozen assessment and projection gate
        run: >-
          PG_DB=assessment_stage2_test MONGO_DB=assessment_stage2_test
          python -m pytest -q tests/test_assessment_ledger.py tests/test_assessment_scoring.py
          tests/test_assessment_evidence.py tests/test_assessment_boundaries.py
          tests/test_assessment_ledger_integration.py tests/test_assessment_api.py

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

      - name: Run Agent E2E regression suite
        run: python -m pytest -v -s -m "agent_e2e and not agent_chat_contract and not agent_e2e_live"

      - name: Run production Agent Harness E2E against three databases
        run: python -m pytest -v -s -m agent_e2e_live

      - name: Run P0 Agent chat context contract gate
        run: python -m pytest -v -m agent_chat_contract

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Run Vitest
        run: npm test -- --run

      - name: Build
        run: npm run build
